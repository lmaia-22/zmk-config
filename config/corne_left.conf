# Left half only (central). ZMK Studio's RPC lives on the central side —
# Kconfig gates it with `select ZMK_STUDIO_RPC if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL`.
# The studio-rpc-usb-uart snippet that provides the CDC-ACM transport is set
# in build.yaml, since snippets cannot be selected from a .conf file.
CONFIG_ZMK_STUDIO=y

# Studio is editable without tapping &studio_unlock first.
CONFIG_ZMK_STUDIO_LOCKING=n
